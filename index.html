<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b6aa0">
<meta name="description" content="Cash register counting helper for Canadian cash">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cash Count</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top">
  <header>
    <button id="drawerBtn" class="chip" aria-label="Switch drawer"><span id="drawerName"></span><span aria-hidden="true"> ▾</span></button>
    <button id="addBtn" class="round" aria-label="New drawer">＋</button>
    <button id="menuBtn" class="round" aria-label="More options">⋯</button>
  </header>
  <section class="total">
    <div class="lbl">Total in drawer</div>
    <div id="total" class="big">$0.00</div>
    <div id="diff" class="diff"></div>
  </section>
</div>

<main id="rows"></main>

<section class="pad">
  <div class="ctx">
    <button id="prevBtn" class="arrow" aria-label="Previous field">‹</button>
    <div id="ctx" class="ctx-text"></div>
    <button id="nextBtn" class="arrow" aria-label="Next field">›</button>
  </div>
  <div class="keys">
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="back" class="fn" aria-label="Backspace">⌫</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="clear" class="fn">C</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="next" class="next">Next<br>›</button>
    <button data-k="0" class="zero">0</button><button data-k="00">00</button>
  </div>
</section>

<dialog id="menuDlg">
  <h2>Options</h2>
  <button data-a="rename">Rename this drawer</button>
  <button data-a="target">Set expected total (float)</button>
  <button data-a="clearDrawer">Clear this drawer</button>
  <button data-a="delete">Delete this drawer</button>
  <button data-a="clearAll">Clear every drawer</button>
  <button data-a="close" class="ghost">Close</button>
</dialog>

<dialog id="drawersDlg">
  <h2>Drawers</h2>
  <div id="drawerList"></div>
  <button id="addDrawer">＋ New drawer</button>
  <div class="sum">All drawers: <b id="allTotal">$0.00</b></div>
  <button data-a="close" class="ghost">Close</button>
</dialog>

<script src="app.js"></script>
</body>
</html>
